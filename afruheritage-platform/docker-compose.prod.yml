version: '3.8'

# Production Docker Compose with Nginx proxy
services:
  # Main Backend API (FastAPI)
  api:
    build: 
      context: .
      target: production
    container_name: afruheritage-api
    env_file:
      - .env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
      - ${RUNNER_DEFAULT_SSH_KEY_PATH:-./secrets/runner_key}:/run/secrets/afruheritage_runner_key:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - afruheritage-network

  # Celery Worker for Background Tasks
  worker:
    build: 
      context: .
      target: production
    container_name: afruheritage-worker
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=INFO
    env_file:
      - .env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
      - ${RUNNER_DEFAULT_SSH_KEY_PATH:-./secrets/runner_key}:/run/secrets/afruheritage_runner_key:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - afruheritage-network

  # Celery Beat for Scheduled Tasks
  beat:
    build: 
      context: .
      target: production
    container_name: afruheritage-beat
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=INFO
    env_file:
      - .env.docker
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - afruheritage-network

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: afruheritage-postgres
    environment:
      POSTGRES_DB: afruheritage
      POSTGRES_USER: afruheritage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afruheritage}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afruheritage -d afruheritage"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - afruheritage-network

  # Redis Cache and Message Broker
  redis:
    image: redis:7-alpine
    container_name: afruheritage-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - afruheritage-network

  # Frontend Application (Next.js)
  frontend:
    build: 
      context: ./frontend
      target: runner
    container_name: afruheritage-frontend
    env_file:
      - ./frontend/.env.docker
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - afruheritage-network

  # Admin Console
  admin-console:
    build: 
      context: ./admin-console
      target: production
    container_name: afruheritage-admin-console
    env_file:
      - ./admin-console/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - afruheritage-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: afruheritage-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - frontend
      - api
      - admin-console
    restart: unless-stopped
    networks:
      - afruheritage-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  afruheritage-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
