name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: afruheritage
          POSTGRES_PASSWORD: afruheritage
          POSTGRES_DB: afruheritage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afruheritage"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      SECRET_KEY: ci-test-secret-key-not-for-production
      DATABASE_URL: postgresql+psycopg://afruheritage:afruheritage@localhost:5432/afruheritage_test
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      REDIS_URL: redis://localhost:6379/0
      DEFAULT_SUBDOMAIN_BASE: afruheritage.com
      RUNNER_DEFAULT_FLEETBASE_ROOT: /tmp/ci-runners
      RUNNER_DEFAULT_SSH_USER: ci
      RUNNER_DEFAULT_SSH_KEY_PATH: /tmp/fake_key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: pytest -v --tb=short
