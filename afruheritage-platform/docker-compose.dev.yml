version: '3.8'

# Development Docker Compose (without Nginx, direct port access)
services:
  # Main Backend API (FastAPI)
  api:
    build: 
      context: .
      target: development
    container_name: afruheritage-api-dev
    env_file:
      - .env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/app
      - ${RUNNER_DEFAULT_SSH_KEY_PATH:-./secrets/runner_key}:/run/secrets/afruheritage_runner_key:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8100:8000"
    restart: unless-stopped
    networks:
      - afruheritage-network

  # Celery Worker for Background Tasks
  worker:
    build: 
      context: .
      target: development
    container_name: afruheritage-worker-dev
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=INFO
    env_file:
      - .env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/app
      - ${RUNNER_DEFAULT_SSH_KEY_PATH:-./secrets/runner_key}:/run/secrets/afruheritage_runner_key:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - afruheritage-network

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: afruheritage-postgres-dev
    environment:
      POSTGRES_DB: afruheritage
      POSTGRES_USER: afruheritage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afruheritage}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afruheritage -d afruheritage"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - afruheritage-network

  # Redis Cache and Message Broker
  redis:
    image: redis:7-alpine
    container_name: afruheritage-redis-dev
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_dev_data:/data
    ports:
      - "6380:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - afruheritage-network

  # Frontend Application (Next.js)
  frontend:
    build: 
      context: ./frontend
      target: runner
    container_name: afruheritage-frontend-dev
    env_file:
      - ./frontend/.env.docker
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - afruheritage-network

  # Admin Console
  admin-console:
    build: 
      context: ./admin-console
      target: development
    container_name: afruheritage-admin-console-dev
    env_file:
      - ./admin-console/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "4000:4000"
    restart: unless-stopped
    networks:
      - afruheritage-network

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local

networks:
  afruheritage-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
