<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #1e293b;
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #ffffff;
        }
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #0ea5e9;
        }
        .content {
            background-color: #ffffff;
            padding: 0;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 16px;
            color: #1e293b;
        }
        p {
            font-size: 16px;
            margin-bottom: 16px;
            color: #475569;
        }
        .button {
            display: inline-block;
            padding: 14px 32px;
            background-color: #0ea5e9;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            margin: 32px 0;
        }
        .button:hover {
            background-color: #0284c7;
        }
        .footer {
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
        }
        .alert {
            padding: 20px;
            border-radius: 8px;
            margin: 24px 0;
        }
        .alert-info {
            background-color: #f0f9ff;
            border: 1px solid #bae6fd;
            color: #0369a1;
        }
        .alert-success {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
        }
        .alert-warning {
            background-color: #fffbeb;
            border: 1px solid #fed7aa;
            color: #92400e;
        }
        .alert-error {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">{{ company_name | default("Afruheritage") }}</div>
    </div>
    
    <div class="content">
        {% block content %}{% endblock %}
    </div>
    
    <div class="footer">
        <p>{{ company_name | default("Afruheritage") }}</p>
        <p>This email was sent to {{ recipient_email }}</p>
        <p>If you no longer wish to receive these emails, you can unsubscribe in your account settings.</p>
    </div>
</body>
</html>
