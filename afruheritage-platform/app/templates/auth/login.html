<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Afruheritage Freight Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .country-flag {
            width: 24px;
            height: 16px;
            margin-right: 8px;
        }
        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }
        .shape {
            position: absolute;
            opacity: 0.1;
        }
        .shape-1 {
            width: 200px;
            height: 200px;
            background: #fff;
            border-radius: 50%;
            top: -100px;
            right: -100px;
        }
        .shape-2 {
            width: 150px;
            height: 150px;
            background: #fff;
            border-radius: 50%;
            bottom: -75px;
            left: -75px;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
    <!-- Floating shapes background -->
    <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <!-- Main login container -->
    <div class="glass-effect rounded-2xl shadow-2xl w-full max-w-md p-8 relative z-10">
        <!-- Logo and branding -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-white rounded-full shadow-lg mb-4">
                <i class="fas fa-shipping-fast text-2xl text-purple-600"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800 mb-2">Afruheritage</h1>
            <p class="text-gray-600 text-sm">Freight Forwarding Platform</p>
        </div>

        <!-- Login form -->
        <form id="loginForm" class="space-y-6">
            <!-- Email/Username field -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                    Email Address
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-envelope text-gray-400"></i>
                    </div>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
                        placeholder="your@email.com"
                    >
                </div>
            </div>

            <!-- Password field -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                    Password
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-lock text-gray-400"></i>
                    </div>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        class="w-full pl-10 pr-10 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
                        placeholder="••••••••"
                    >
                    <button
                        type="button"
                        id="togglePassword"
                        class="absolute inset-y-0 right-0 pr-3 flex items-center"
                    >
                        <i class="fas fa-eye text-gray-400 hover:text-gray-600"></i>
                    </button>
                </div>
            </div>

            <!-- Remember me & Forgot password -->
            <div class="flex items-center justify-between">
                <label class="flex items-center">
                    <input
                        type="checkbox"
                        id="remember"
                        class="w-4 h-4 text-purple-600 border-gray-300 rounded focus:ring-purple-500"
                    >
                    <span class="ml-2 text-sm text-gray-600">Remember me</span>
                </label>
                <a href="#" class="text-sm text-purple-600 hover:text-purple-500">
                    Forgot password?
                </a>
            </div>

            <!-- Submit button -->
            <button
                type="submit"
                id="loginBtn"
                class="w-full bg-purple-600 text-white py-2 px-4 rounded-lg hover:bg-purple-700 focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 transition duration-200 flex items-center justify-center"
            >
                <span id="loginText">Sign In</span>
                <i id="loginSpinner" class="fas fa-spinner fa-spin ml-2 hidden"></i>
            </button>

            <!-- Error message -->
            <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
                <i class="fas fa-exclamation-circle mr-2"></i>
                <span id="errorText"></span>
            </div>
        </form>

        <!-- Country/Region optimization notice -->
        <div class="mt-6 p-4 bg-blue-50 rounded-lg border border-blue-200">
            <div class="flex items-start">
                <i class="fas fa-globe-africa text-blue-500 mt-0.5 mr-3"></i>
                <div>
                    <h3 class="text-sm font-medium text-blue-800">Optimized for Your Region</h3>
                    <p class="text-xs text-blue-600 mt-1">
                        Enhanced support for Ghana 🇬🇭 and China 🇨🇳 logistics operations
                    </p>
                </div>
            </div>
        </div>

        <!-- Sign up link -->
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600">
                Don't have an account?
                <a href="#" class="text-purple-600 hover:text-purple-500 font-medium">
                    Request Access
                </a>
            </p>
        </div>
    </div>

    <!-- Loading overlay -->
    <div id="loadingOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 flex flex-col items-center">
            <i class="fas fa-spinner fa-spin text-3xl text-purple-600 mb-4"></i>
            <p class="text-gray-700">Signing in...</p>
        </div>
    </div>

    <script>
        // Password visibility toggle
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // Form submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            
            // Show loading state
            const loginBtn = document.getElementById('loginBtn');
            const loginText = document.getElementById('loginText');
            const loginSpinner = document.getElementById('loginSpinner');
            const errorMessage = document.getElementById('errorMessage');
            
            loginBtn.disabled = true;
            loginText.textContent = 'Signing In';
            loginSpinner.classList.remove('hidden');
            errorMessage.classList.add('hidden');
            
            try {
                // Get current tenant subdomain from URL
                const tenantSlug = window.location.hostname.split('.')[0];
                const apiUrl = `/api/v1/auth/login`;
                
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: email,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Store token
                    if (remember) {
                        localStorage.setItem('authToken', data.access_token);
                    } else {
                        sessionStorage.setItem('authToken', data.access_token);
                    }
                    
                    // Redirect to dashboard
                    window.location.href = '/dashboard';
                } else {
                    throw new Error(data.detail || 'Login failed');
                }
                
            } catch (error) {
                // Show error message
                const errorText = document.getElementById('errorText');
                errorText.textContent = error.message || 'An error occurred during login';
                errorMessage.classList.remove('hidden');
                
                // Reset button state
                loginBtn.disabled = false;
                loginText.textContent = 'Sign In';
                loginSpinner.classList.add('hidden');
            }
        });

        // Auto-detect region and show appropriate message
        function detectRegion() {
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const regionDiv = document.querySelector('.bg-blue-50');
            
            // Check for Ghana timezone
            if (timezone.includes('Accra')) {
                regionDiv.innerHTML = `
                    <div class="flex items-start">
                        <span class="text-2xl mr-3">🇬🇭</span>
                        <div>
                            <h3 class="text-sm font-medium text-blue-800">Welcome to Ghana Operations</h3>
                            <p class="text-xs text-blue-600 mt-1">
                                Optimized for Ghana freight forwarding with local currency support
                            </p>
                        </div>
                    </div>
                `;
            }
            // Check for China timezone
            else if (timezone.includes('Shanghai') || timezone.includes('Beijing') || timezone.includes('Hongkong')) {
                regionDiv.innerHTML = `
                    <div class="flex items-start">
                        <span class="text-2xl mr-3">🇨🇳</span>
                        <div>
                            <h3 class="text-sm font-medium text-blue-800">欢迎来到中国运营</h3>
                            <p class="text-xs text-blue-600 mt-1">
                                Optimized for China logistics with CNY support
                            </p>
                        </div>
                    </div>
                `;
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            detectRegion();
            
            // Check for existing session
            const token = localStorage.getItem('authToken') || sessionStorage.getItem('authToken');
            if (token) {
                window.location.href = '/dashboard';
            }
        });
    </script>
</body>
</html>
