# /etc/nginx/sites-available/afruheritage
# ─────────────────────────────────────────────────────────────────────────────
# AfruHeritage multi-tenant platform — host nginx config
#
# Install:
#   sudo cp /path/to/this/file /etc/nginx/sites-available/afruheritage
#   sudo ln -sf /etc/nginx/sites-available/afruheritage \
#               /etc/nginx/sites-enabled/afruheritage
#   sudo nginx -t && sudo systemctl reload nginx
#
# Architecture:
#   - afruheritage.com          → Next.js frontend (port 3002)
#   - *.afruheritage.com        → Next.js frontend (port 3002) with X-Tenant-Slug header
#   - api.afruheritage.com      → FastAPI backend  (port 8100)
#   - admin.afruheritage.com    → Admin console    (port 4000)
#   - sentinel.afruheritage.com → Sentinel         (port 9200)
#
# The X-Tenant-Slug header is read by Next.js middleware to resolve the tenant
# from the subdomain — zero per-tenant nginx changes needed.
# ─────────────────────────────────────────────────────────────────────────────

# ── Upstream definitions ──────────────────────────────────────────────────────
upstream afr_frontend {
    server 127.0.0.1:3002;
    keepalive 32;
}

upstream afr_api {
    server 127.0.0.1:8100;
    keepalive 32;
}

upstream afr_admin {
    server 127.0.0.1:4000;
    keepalive 16;
}

upstream afr_sentinel {
    server 127.0.0.1:9200;
    keepalive 16;
}

# ── Main platform site (afruheritage.com) ────────────────────────────────────
server {
    listen 80;
    server_name afruheritage.com www.afruheritage.com;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"         always;
    add_header X-Content-Type-Options "nosniff"            always;
    add_header X-XSS-Protection       "1; mode=block"      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Frontend
    location / {
        proxy_pass         http://afr_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # API pass-through
    location /api/ {
        proxy_pass         http://afr_api/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# ── API subdomain ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.afruheritage.com;

    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass         http://afr_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }
}

# ── Admin subdomain ───────────────────────────────────────────────────────────
server {
    listen 80;
    server_name admin.afruheritage.com;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;

    location / {
        proxy_pass         http://afr_admin;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ── Sentinel subdomain ────────────────────────────────────────────────────────
server {
    listen 80;
    server_name sentinel.afruheritage.com;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;

    location / {
        proxy_pass         http://afr_sentinel;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ── Wildcard tenant subdomains (*.afruheritage.com) ──────────────────────────
# Matches any subdomain not handled above (every registered tenant slug).
# nginx regex captures the subdomain and passes it as X-Tenant-Slug so
# the Next.js middleware can resolve the tenant without touching DNS per-tenant.
server {
    listen 80;
    server_name ~^(?P<slug>[^.]+)\.afruheritage\.com$;

    # Block reserved subdomains
    if ($slug ~* "^(www|api|admin|sentinel|mail|smtp|ftp|ssh|panel|ns1|ns2)$") {
        return 404;
    }

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Frontend — tenant slug injected as header
    location / {
        proxy_pass         http://afr_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Tenant-Slug     $slug;   # ← key header
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # API pass-through on tenant subdomain
    location /api/ {
        proxy_pass         http://afr_api/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Tenant-Slug     $slug;
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
