services:
  api:
    build: .
    container_name: afruheritage-api
    env_file:
      - .env
    volumes:
      - ./:/app
      - ${RUNNER_DEFAULT_SSH_KEY_PATH:-./secrets/runner_key}:/run/secrets/afruheritage_runner_key:ro
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  worker:
    build: .
    container_name: afruheritage-worker
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=INFO
    env_file:
      - .env
    volumes:
      - ./:/app
      - ${RUNNER_DEFAULT_SSH_KEY_PATH:-./secrets/runner_key}:/run/secrets/afruheritage_runner_key:ro
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: afruheritage-postgres
    environment:
      POSTGRES_DB: afruheritage
      POSTGRES_USER: afruheritage
      POSTGRES_PASSWORD: afruheritage
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: afruheritage-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  redis_data:
